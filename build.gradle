plugins {
    id 'java'
    id('com.gradleup.shadow') version '9.4.1'
    id 'xyz.jpenilla.run-paper' version "3.0.2"
}

group = 'net.mysterria.stuff'
version = '1.1.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://repo.hibiscusmc.com/releases/"
    }
    maven {
        url = "https://repo.triumphteam.dev/snapshots"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }

    maven {
        name = "pinodevRepo"
        url = "https://repo.pinodev.it/releases"
    }
}

tasks.build.dependsOn(shadowJar)

dependencies {
    implementation("dev.triumphteam:triumph-gui-paper:3.1.13")
    compileOnly("dev.ua.ikeepcalm:circle-of-imagination-api:1.4.8-SNAPSHOT")
    compileOnly("de.skyslycer.hmcwraps:api:1.7.0")
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("it.pino.zelchat:zelchat-api:2.0.0-pre-27")
    implementation 'dev.ua.ikeepcalm.mysterria:audit-client:1.0.0'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'dev.ua.ikeepcalm.mysterria.audit', 'net.mysterria.stuff.libs.audit'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
