plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = 'net.mysterria.stuff'
version = '2.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.hibiscusmc.com/releases/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://nexus.mysterria.net/repository/plugin-public/' }
    maven { url = 'https://repo.pinodev.it/releases' }
}

dependencies {
    implementation 'dev.triumphteam:triumph-gui-paper:3.1.13'
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    compileOnly 'dev.ua.ikeepcalm:circle-of-imagination-api:1.4.0-SNAPSHOT'
    compileOnly 'de.skyslycer.hmcwraps:api:1.7.0'
    compileOnly 'it.pino.zelchat:zelchat-api:2.0.0-pre-27'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.build.dependsOn(shadowJar)

tasks.runServer {
    minecraftVersion('26.3')
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
