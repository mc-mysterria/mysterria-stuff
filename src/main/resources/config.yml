debug-mode: false

features:
  booster-patriarch: true
  ritual-fallbacks: true
  universal-token: true
  joinmsg-token: true
  last-sprint: true
  chat-aliases: true

# lowercase letters and digits only; an empty list disables the route
chat-aliases:
  aliases:
    church: [c, cc, church]
    organization: [o, oc, org, order]
    lineage: [lin, lineage, family]
    lands: [l, land, lands]
    nations: [n, nation, nations]
    party: [p, party, dp, dparty]
    staff: [s, sc, staff]
    message: [m, msg, dm, pm, w, whisper, tell]
    reply: [r, reply]

last-sprint:
  active: false

coi-booster-patriarch:
  api-url: "https://api.mysterria.net/api/user/boosters"
  update-interval-seconds: 300

universal-token:
  item-name: "&6&lUniversal Wrap Token"
  item-lore:
    - "&7Right-click to browse every wrap"
    - "&7and trade this token for one."
    - ""
    - "&eLeft-click &7a wrap to preview it"
    - "&aRight-click &7a wrap to exchange"
  gui-main-title: "&6Universal Token - Categories"
  gui-category-title: "&6{category} Wraps"
  gui-confirm-title: "&8Exchange token?"
  messages:
    token-received: "&aYou received {amount} Universal Wrap Token(s)."
    no-wraps-available: "&cNo wraps are available right now."
    wrap-exchanged: "&aExchanged your token for &e{wrap}&a."
    no-token: "&cYou need a Universal Wrap Token in your inventory."
    preview-started: "&7Previewing &e{wrap}&7. The menu reopens when the preview ends."
    exchange-cancelled: "&7Exchange cancelled. Your token was not used."
    no-permission: "&cYou can't use this token."

joinmsg-token:
  item-name: "&b&lCustom Message Token"
  item-lore:
    - "&7Right-click to set your own"
    - "&7join and quit messages."
    - ""
    - "&7Write &6%player% &7where your name goes."
  messages:
    token-received: "&aYou received {amount} Custom Message Token(s)."
    no-permission: "&cYou can't use this token."
    already-in-session: "&cYou are already setting up your messages. Finish or cancel that first."
    session-start: "&b&lCustom join and quit messages\n&7Your token is held until you confirm. Cancel any time to get it back."
    join-prompt: "&e&lStep 1/2: &7Type your &ajoin message &7in chat.\n&7Write &6%player% &7where your name goes. Example: &a%player% &7has arrived!"
    format-info: "&7Supports colour codes: &c&lRed &6&lGold &e&lYellow &a&lGreen &b&lAqua &9&lBlue &d&lPurple"
    join-received: "&a✓ Join message saved."
    quit-prompt: "&e&lStep 2/2: &7Type your &cquit message &7in chat.\n&7Write &6%player% &7where your name goes. Example: &c%player% &7has left."
    quit-received: "&a✓ Quit message saved."
    preview-header: "&e&lPreview"
    confirm-prompt: "&7Confirm to use your token, or restart to rewrite them."
    use-buttons: "&cYour messages are ready. Use the buttons above, or &f/mystuff joinmsg confirm&c / &fcancel&c."
    success: "&a&l✓ &aYour join and quit messages are set."
    join-missing-placeholder: "&c✗ Your join message needs &6%player%&c. Type it again."
    quit-missing-placeholder: "&c✗ Your quit message needs &6%player%&c. Type it again."
    session-cancelled: "&7Cancelled. Nothing was changed."
    token-refunded: "&aYour token was returned."
    session-restarted: "&eStarting over."
    no-active-session: "&cYou are not setting up any messages."
    not-ready-to-confirm: "&cFinish both messages before confirming."
    write-error: "&c✗ Your messages could not be saved, so your token was returned. Please tell staff."
