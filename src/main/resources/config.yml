# MysterriaStuff Configuration File
#
# This plugin provides various utilities and fixes for the Mysterria server
#
# For help, use /mystuff help in-game

# ═══════════════════════════════════════════════════════════════
# General Settings
# ═══════════════════════════════════════════════════════════════

# Enable debug mode to see detailed messages in console
debug-mode: false

# Plugin prefix color (hex color code)
# Default: #AA55FF (purple)
prefix-color: "#AA55FF"

# ═══════════════════════════════════════════════════════════════
# Feature Toggles
# ═══════════════════════════════════════════════════════════════

features:
  # Reinforced Elytra protection system
  elytra-blocker: true

  # Lightning strike fix for HuskTowns compatibility
  lightning-fix: true

  # CircleOfImagination dangerous actions listener
  # Prevents duplication and unauthorized use of mystical items
  coi-protection: true

  # Runtime recipe manager
  # Allows creating custom recipes without server restart
  recipe-manager: true

  # Universal Token for HMCWraps integration
  # Allows players to exchange tokens for any available wrap
  universal-token: true

  # Booster Patriarch System
  # Automatically grants/removes patriarch role based on booster status
  booster-patriarch: true

  # CoI Ritual Fallbacks
  # Handles custom ritual completion logic that is server-specific rather than pathway-specific
  ritual-fallbacks: true

  # Join/Quit Message Token
  # Allows players to set their own custom join/quit messages
  joinmsg-token: true

  # Last Sprint Welcome Kit
  # Gives first-time players a configurable reward kit before The Great Reset
  # Configure the kit contents via /mystuff lastsprint setup
  last-sprint: true

  # Dungeon World Enforcer
  # Pre-creates a void (completely empty) world before a third-party dungeon plugin can,
  # so the plugin's structures are placed in a void rather than over generated terrain.
  # MysterriaStuff must load before the dungeon plugin — add it to 'loadbefore' in plugin.yml.
  dungeon-world-enforcer: false

  # Chat Shortcuts
  # Registers a ZelChat module that turns '!<alias> <message>' into the owning plugin's
  # chat command, so players use one interface for every provider-owned channel.
  chat-aliases: true

# ═══════════════════════════════════════════════════════════════
# Chat Shortcut Settings
# ═══════════════════════════════════════════════════════════════

# Each key below is a fixed route with a hard-coded destination command; only the alias
# list is configurable. Values are never command strings, so this configuration cannot
# turn a chat message into arbitrary command execution.
#
# Rename a route by editing its list, or disable it with an empty list ([]).
# Aliases must be lowercase letters and digits only; anything else is logged and ignored.
# An alias claimed by two routes stays with the first route listed here.
#
# Global chat keeps MysterriaTranslator's existing '!<message>' shortcut — this module only
# claims '!' messages whose first word matches an alias below, and leaves every other
# message untouched. Local/ranged channels intentionally have no alias.
#
# Membership, permission, ignore and formatting rules stay with the destination plugin;
# staff aliases go through ZelChat's /staffchat and keep its own permission checks.
chat-aliases:
  aliases:
    church: [c, cc, church]
    organization: [o, oc, org, order]
    lineage: [lin, lineage, family]
    lands: [l, land, lands]
    nations: [n, nation, nations]
    party: [p, party, dp, dparty]
    staff: [s, sc, staff]
    message: [m, msg, dm, pm, w, whisper, tell]
    reply: [r, reply]

# ═══════════════════════════════════════════════════════════════
# Dungeon World Enforcer Settings
# ═══════════════════════════════════════════════════════════════

dungeon-world-enforcer:
  # The world name that the dungeon plugin creates
  world-name: "dungeons_normal_0"

# ═══════════════════════════════════════════════════════════════
# Last Sprint Settings
# ═══════════════════════════════════════════════════════════════

last-sprint:
  # Controls whether new players automatically receive the kit on join.
  # Set up rewards via /mystuff lastsprint setup first, then enable with /mystuff lastsprint enable.
  active: false

# ═══════════════════════════════════════════════════════════════
# CircleOfImagination Protection Settings
# ═══════════════════════════════════════════════════════════════

coi-protection:
  # Reset player attributes on join
  reset-attributes-on-join: true

  # Restrict spectator movement through blocks (except ops)
  restrict-spectator-noclip: true

  # Prevent item pickup in nightmare worlds
  block-nightmare-pickups: true

  # Keep inventory on death in nightmare worlds
  nightmare-keep-inventory: true

# ═══════════════════════════════════════════════════════════════
# CoI Name Zones
# ═══════════════════════════════════════════════════════════════

# When enabled, CoI names only respond to players inside a defined zone.
# Players in a zone get per-player night time and periodic atmospheric lightning.
# If enabled is false or zones list is empty, names work anywhere in the main world.

coi-zones:
  enabled: false
  zones: []
  # zones:
  #   - name: "ancient-sanctum"
  #     world: "world"
  #     min-y: 60
  #     max-y: 120
  #     # At least 3 XZ vertices define the polygon shape of the zone.
  #     # Any convex or concave polygon is supported.
  #     vertices:
  #       - { x: -100, z: -100 }
  #       - { x:  100, z: -150 }
  #       - { x:  150, z:   50 }
  #       - { x:    0, z:  120 }
  #       - { x: -120, z:   30 }
  #     # Force perpetual night for the player while inside (per-player, not server-wide)
  #     always-night: true
  #     # Strike lightning effects near the player periodically
  #     lightning-effects: true
  #     # How often to strike (in ticks, 20 ticks = 1 second)
  #     lightning-interval-ticks: 100
  #     # Maximum distance from the player a lightning bolt can spawn
  #     lightning-radius: 30

# ═══════════════════════════════════════════════════════════════
# Booster Patriarch Settings
# ═══════════════════════════════════════════════════════════════

coi-booster-patriarch:
  # API endpoint to fetch the list of current boosters
  api-url: "https://api.mysterria.net/api/user/boosters"

  # How often to check for booster list updates (in seconds)
  # Default: 300 seconds (5 minutes)
  update-interval-seconds: 300

# ═══════════════════════════════════════════════════════════════
# Recipe Manager Settings
# ═══════════════════════════════════════════════════════════════

recipes:
  # Enable runtime recipe system
  enabled: true

  # Maximum number of custom recipes allowed
  max-recipes: 100

  # Log recipe additions/removals
  log-changes: true

# ═══════════════════════════════════════════════════════════════
# Universal Token Settings
# ═══════════════════════════════════════════════════════════════

universal-token:
  # Token item appearance
  item-name: "&6&lUniversal Wrap Token"

  # Token lore (supports color codes and placeholders)
  item-lore:
    - "&7Right-click to browse all available wraps"
    - "&7and exchange this token for one!"
    - ""
    - "&eLeft-click &7a wrap to preview"
    - "&aRight-click &7a wrap to exchange"
    - ""
    - "&d&lUNIVERSAL TOKEN"

  # GUI titles
  gui-main-title: "&6Universal Token - Categories"
  gui-category-title: "&6{category} Wraps"
  gui-confirm-title: "&cConfirm Exchange?"

  # Messages
  messages:
    token-received: "&aYou received {amount} Universal Wrap Token(s)!"
    no-wraps-available: "&cNo wraps are currently available!"
    wrap-exchanged: "&aSuccessfully exchanged token for &e{wrap}&a!"
    no-token-in-hand: "&cYou must hold a Universal Token to use this command!"
    preview-started: "&7Previewing &e{wrap}&7... Right-click again to cancel."
    exchange-cancelled: "&7Exchange cancelled."
    hmcwraps-not-loaded: "&cHMCWraps plugin is not loaded!"
    no-permission: "&cYou don't have permission to use this!"

